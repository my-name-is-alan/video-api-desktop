name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend
        run: npm ci

      - name: Fetch FFmpeg sidecars
        shell: bash
        run: bash .github/scripts/fetch-ffmpeg.sh

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: YCDownload v__VERSION__
          releaseBody: Windows NSIS/MSI and macOS DMG.
          releaseDraft: false
          prerelease: false


      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ycdownload-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/**
            src-tauri/target/release/bundle/msi/**
            src-tauri/target/release/bundle/dmg/**
            src-tauri/target/release/bundle/macos/**
